server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTML 入口不缓存，避免旧 bundle 引用滞留
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  # 带 hash 的静态资源可长期缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
