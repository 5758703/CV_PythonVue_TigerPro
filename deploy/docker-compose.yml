# Tiger AI Platform · Docker Compose（实验性）
# 用法：在仓库根目录执行
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 访问：http://localhost  （门户）  http://localhost/console/  （控制台）

name: tiger-ai

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tiger_root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-cv_python_tigerpro}
      MYSQL_USER: ${DB_USER:-tiger}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tiger_pass_change_me}
    ports:
      # 仅本机调试需要时映射；生产可注释
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    volumes:
      - tiger_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-tiger_root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-tiger}
      DB_PASSWORD: ${DB_PASSWORD:-tiger_pass_change_me}
      DB_NAME: ${DB_NAME:-cv_python_tigerpro}
      HF_TOKEN: ${HF_TOKEN:-}
      MODELSCOPE_TOKEN: ${MODELSCOPE_TOKEN:-}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      YOLO_INFER_BACKEND: ${YOLO_INFER_BACKEND:-auto}
      OBJECT_STORE_BACKEND: ${OBJECT_STORE_BACKEND:-local}
    volumes:
      - tiger_uploads:/app/uploads
    # 开发调试可打开：- "5001:5001"
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  portal:
    build:
      context: ..
      dockerfile: deploy/frontend_home/Dockerfile
      args:
        # 经网关访问时，控制台在 /console/
        VITE_ADMIN_URL: ${PUBLIC_ADMIN_URL:-/console/}
    restart: unless-stopped
    expose:
      - "80"

  admin:
    build:
      context: ..
      dockerfile: deploy/frontend_admin/Dockerfile
      args:
        VITE_PORTAL_URL: ${PUBLIC_PORTAL_URL:-/}
        VITE_BASE: ${ADMIN_VITE_BASE:-/console/}
    restart: unless-stopped
    expose:
      - "80"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - portal
      - admin
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  tiger_mysql_data:
  tiger_uploads:
