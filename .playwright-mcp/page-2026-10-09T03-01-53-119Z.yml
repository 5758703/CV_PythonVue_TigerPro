            - paragraph [ref=e322]:
              - emphasis [ref=e323]: Click the image above to see NeuCodec in action on Youtube!
            - paragraph [ref=e324]:
              - emphasis [ref=e325]: Created by Neuphonic - building faster, smaller, on-device voice AI
            - paragraph [ref=e326]:
              - text: A lightweight neural codec that encodes audio at just 0.8 kbps - perfect for researchers and builders who need something that
              - emphasis [ref=e327]: just works
              - text: for training high quality text-to-speech models.
            - heading "Key Features" [level=1] [ref=e328]:
              - link [ref=e329] [cursor=pointer]:
                - /url: "#key-features"
                - img [ref=e331]
              - generic [ref=e333]: Key Features
            - list [ref=e334]:
              - listitem [ref=e335]: 🔊 Low bit-rate compression - a speech codec that compresses and reconstructs audio with near-inaudible reconstruction loss
              - listitem [ref=e336]: 🎼 Upsamples from 16kHz → 24kHz
              - listitem [ref=e337]: 🌍 Ready for real-world use - train your own SpeechLMs without needing to build your own codec
              - listitem [ref=e338]: 🏢 Commercial use permitted - use it in your own tools or products
              - listitem [ref=e339]: 📊 Released with large pre-encoded datasets - we’ve compressed Emilia-YODAS from 1.7TB to 41GB using NeuCodec, significantly reducing the compute requirements needed for training
            - heading "Model Details" [level=1] [ref=e340]:
              - link [ref=e341] [cursor=pointer]:
                - /url: "#model-details"
                - img [ref=e343]
              - generic [ref=e345]: Model Details
            - paragraph [ref=e346]: "NeuCodec is a Finite Scalar Quantisation (FSQ) based 0.8kbps audio codec for speech tokenization. It takes advantage of the following features:"
            - list [ref=e347]:
              - listitem [ref=e348]: FSQ quantisation resulting in a single codebook, making it ideal for downstream modeling with Speech Language Models.
              - listitem [ref=e349]: Trained with CC data such that there are no Non-Commercial data restrictions.
              - listitem [ref=e350]: At 50 tokens/sec and 16 bits per token, the overall bit-rate is 0.8kbps.
              - listitem [ref=e351]: The codec takes in 16kHz input and outputs 24kHz using an upsampling decoder.
              - listitem [ref=e352]: The FSQ encoding scheme allows for bit-level error resistance suitable for unreliable and noisy channels.
            - paragraph [ref=e353]:
              - text: NeuCodec is largely based on extending the work of
              - link "X-Codec2.0" [ref=e354] [cursor=pointer]:
                - /url: https://huggingface.co/HKUSTAudio/xcodec2
              - text: .
            - list [ref=e355]:
