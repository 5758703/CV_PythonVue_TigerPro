            - heading "Setup" [level=1] [ref=e375]:
              - link [ref=e376] [cursor=pointer]:
                - /url: "#setup"
                - img [ref=e378]
              - generic [ref=e380]: Setup
            - paragraph [ref=e381]: "NeuCodec is now supported natively in 🤗 Transformers. Until it is part of an official Transformers release, install from source:"
            - code [ref=e383]: pip install git+https://github.com/huggingface/transformers
            - heading "Usage example" [level=2] [ref=e384]:
              - link [ref=e385] [cursor=pointer]:
                - /url: "#usage-example"
                - img [ref=e387]
              - generic [ref=e389]: Usage example
            - paragraph [ref=e390]: "Here is a quick example of how to encode and decode an audio using this model:"
            - code [ref=e392]: "from datasets import Audio, load_dataset from transformers import AutoFeatureExtractor, AutoModel model_id = \"neuphonic/neucodec\" model = AutoModel.from_pretrained(model_id, device_map=\"auto\") feature_extractor = AutoFeatureExtractor.from_pretrained(model_id) dataset = load_dataset(\"hf-internal-testing/librispeech_asr_dummy\", \"clean\", split=\"validation\") dataset = dataset.cast_column(\"audio\", Audio(sampling_rate=feature_extractor.sampling_rate)) audio = dataset[0][\"audio\"][\"array\"] inputs = feature_extractor(audio=audio, sampling_rate=feature_extractor.sampling_rate, return_tensors=\"pt\").to( model.device, model.dtype ) print(\"Input waveform shape:\", inputs[\"input_values\"].shape) # Input waveform shape: torch.Size([1, 1, 93760]) # encoder and decoder audio_codes = model.encode(**inputs).audio_codes print(\"Audio codes shape:\", audio_codes.shape) # Audio codes shape: torch.Size([1, 1, 293]) audio_values = model.decode(audio_codes).audio_values print(\"Audio values shape:\", audio_values.shape) # Audio values shape: torch.Size([1, 1, 93760]) # Equivalently, you can do encoding and decoding in one step model_output = model(**inputs) audio_codes = model_output.audio_codes audio_values = model_output.audio_values"
            - heading "Get Started (Legacy)" [level=1] [ref=e393]:
              - link [ref=e394] [cursor=pointer]:
                - /url: "#get-started-legacy"
                - img [ref=e396]
              - generic [ref=e398]: Get Started (Legacy)
            - paragraph [ref=e399]: Use the code below to get started with the model.
            - paragraph [ref=e400]: "To install from pypi in a dedicated environment, using Python 3.10 or above:"
            - code [ref=e402]: conda create -n neucodec python=3.10 conda activate neucodec pip install neucodec
            - paragraph [ref=e403]: "Then, to use in python:"
            - code [ref=e405]:
              - text: "import librosa import torch import torchaudio from torchaudio import transforms as T from neucodec import NeuCodec model = NeuCodec.from_pretrained(\"neuphonic/neucodec\") model.eval().cuda() y, sr = torchaudio.load(librosa.ex(\"libri1\")) if sr != 16_000: y = T.Resample(sr, 16_000)(y)[None, ...] # (B, 1, T_16) with torch.no_grad(): fsq_codes = model.encode_code(y) # fsq_codes = model.encode_code(librosa.ex(\"libri1\")) # or directly pass your filepath! print("
              - generic [ref=e406]: "f\"Codes shape: {fsq_codes.shape}\""
              - text: ") recon = model.decode_code(fsq_codes).cpu() # (B, 1, T_24) torchaudio.save(\"reconstructed.wav\", recon[0, :, :], 24_000)"
